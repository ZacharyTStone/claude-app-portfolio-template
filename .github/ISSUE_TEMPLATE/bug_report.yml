name: Bug report
description: Something on the site or in the build doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. If this is a security problem, please don't
        file it here: see the security policy instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The site in a browser
        - npm run dev / npm run build
        - npm run verify, or one of its steps
        - npm run fonts
        - npm run update-template
        - Ask (/ask)
        - CI (GitHub Actions)
        - Deploying (Cloudflare or another host)
        - Somewhere else
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / device or Node version
      placeholder: "Safari 18 on iPhone, or Node 22.23.4 on macOS"
  - type: textarea
    id: config
    attributes:
      label: The relevant part of site.config.ts, or the error message
      description: Leave out anything private.
      render: ts
