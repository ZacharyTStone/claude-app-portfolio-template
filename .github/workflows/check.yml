name: Check

on:
  push:
    branches: [main]
  pull_request:

# The checks only read the repo, so the job's token can't write to it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Each action is pinned to a commit, with its version beside it: a tag can be moved, a commit can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Everything, in order, as it runs on your machine: the chain is `verify` in package.json. A site with a
      # GitHub history builds with the token in the repo's secret BUILD_GITHUB_TOKEN (docs/github-history.md);
      # without the secret, GITHUB_TOKEN is empty, and the build asks GitHub as it would with none.
      - run: npm run verify
        env:
          GITHUB_TOKEN: ${{ secrets.BUILD_GITHUB_TOKEN }}
